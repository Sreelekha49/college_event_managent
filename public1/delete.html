<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete College Event</title>

    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }

        body {

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            color: #344E41;

            padding: 30px 18px;

            /* College campus background image */

            background-image:

                linear-gradient(

                    rgba(245, 240, 230, 0.30),

                    rgba(245, 240, 230, 0.30)

                ),

                url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1920&q=85");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }

        header {

            text-align: center;

            margin-bottom: 22px;

            padding: 20px;

            background: rgba(255, 252, 245, 0.90);

            border-radius: 15px;

        }

        h1 {

            color: #344E41;

            margin-bottom: 18px;

            font-size: clamp(1.7rem, 4vw, 2.3rem);

        }

        nav {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;

            margin: 18px auto;

            max-width: 1000px;

        }

        nav a {

            display: inline-block;

            text-decoration: none;

            color: #FFFFFF;

            background: #6B8F71;

            padding: 10px 14px;

            border-radius: 8px;

            font-size: 0.95rem;

            transition: background 0.2s ease, transform 0.2s ease;

        }

        nav a:hover {

            background: #3A5A40;

            transform: translateY(-2px);

        }

        main {

            width: 100%;

            max-width: 520px;

            margin: 60px auto;

            padding: 30px;

            /* White card in front of the image */

            background: rgba(255, 255, 255, 0.94);

            border: 1px solid #D8DDCE;

            border-radius: 16px;

            box-shadow: 0 10px 28px rgba(52, 78, 65, 0.25);

        }

        h2 {

            color: #344E41;

            margin-bottom: 10px;

            font-size: 1.6rem;

            text-align: center;

        }

        .description {

            color: #6B7280;

            margin-bottom: 24px;

            line-height: 1.5;

            text-align: center;

        }

        label {

            display: block;

            font-weight: 600;

            margin-bottom: 9px;

            color: #344E41;

        }

        input[type="number"] {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #B7C4B1;

            border-radius: 8px;

            font-size: 1rem;

            outline: none;

            background: #FFFCF5;

            color: #344E41;

        }

        input[type="number"]:focus {

            border-color: #6B8F71;

            box-shadow: 0 0 0 3px rgba(107, 143, 113, 0.18);

        }

        .actions {

            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 22px;

        }

        button {

            border: none;

            border-radius: 8px;

            padding: 12px 18px;

            font-size: 1rem;

            font-weight: 600;

            cursor: pointer;

            transition: background 0.2s ease, transform 0.2s ease;

        }

        button:hover {

            transform: translateY(-1px);

        }

        .delete-btn {

            flex: 1;

            color: #FFFFFF;

            background: #6B8F71;

        }

        .delete-btn:hover {

            background: #3A5A40;

        }

        .home-btn {

            flex: 1;

            color: #344E41;

            background: #E7E3D4;

        }

        .home-btn:hover {

            background: #DCE5D8;

        }

        @media (max-width: 600px) {

            body {

                padding: 20px 12px;

            }

            main {

                padding: 22px 18px;

                margin: 30px auto;

            }

            nav a {

                font-size: 0.88rem;

                padding: 9px 11px;

            }

            .actions {

                flex-direction: column;

            }

        }

    </style>

</head>

<body>

    <header>

        <h1>College Event Management</h1>

        <nav aria-label="Main navigation">

            <a href="index.html">Home</a>

            <a href="events.html">List Events</a>

            <a href="eventOne.html">Find Event</a>

            <a href="insert.html">Add Event</a>

            <a href="update.html">Update Event</a>

            <a href="delete.html">Delete Event</a>

        </nav>

    </header>

    <main>

        <h2>Delete College Event</h2>

        <p class="description">

            Enter the Event ID you want to delete.

        </p>

        <form id="deleteForm">

            <label for="sno">Event ID</label>

            <input

                type="number"

                id="sno"

                required

                placeholder="Enter Event ID (e.g. 101)"

            >

            <div class="actions">

                <button type="submit" class="delete-btn">

                    Delete Event

                </button>

                <button

                    type="button"

                    class="home-btn"

                    onclick="location.href='index.html'">

                    Home Page

                </button>

            </div>

        </form>

    </main>

    <script>

        document.getElementById("deleteForm").addEventListener(

            "submit",

            function (event) {

                event.preventDefault();

                deleteEvent();

            }

        );

        function deleteEvent() {

            const eventId = document.getElementById("sno").value.trim();

            if (!eventId) {

                alert("Please enter an Event ID.");

                return;

            }

            if (!confirm("Are you sure you want to delete this event?")) {

                return;

            }

            fetch("/events/" + encodeURIComponent(eventId), {

                method: "DELETE"

            })

            .then(async response => {

                const message = await response.text();

                if (!response.ok) {

                    throw new Error(

                        message || "Unable to delete event."

                    );

                }

                return message;

            })

            .then(message => {

                alert(message);

                location.href = "index.html";

            })

            .catch(error => {

                alert(error.message);

            });

        }

    </script>

</body>

</html>
