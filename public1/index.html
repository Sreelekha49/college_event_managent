<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>College Event Management</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body { min-height: 100vh; font-family: Arial, Helvetica, sans-serif; /* College Campus Background Image */ background-image: linear-gradient( rgba(247, 244, 233, 0.35), rgba(247, 244, 233, 0.35) ), url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1920&q=85"); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; color: #34483A; padding: 28px 16px; } header { text-align: center; margin-bottom: 28px; background: rgba(247, 244, 233, 0.90); padding: 22px 15px; border-radius: 15px; } h1 { color: #526B52; font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: 20px; } nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 1100px; margin: 0 auto; } nav a { display: inline-block; padding: 11px 15px; border-radius: 9px; background: #879B79; color: #fff; text-decoration: none; font-size: 0.95rem; transition: 0.2s; } nav a:hover { background: #526B52; transform: translateY(-1px); } main { max-width: 850px; margin: 30px auto; padding: 30px; /* Transparent white dashboard card */ background: rgba(255, 255, 255, 0.94); border: 1px solid #E6E0CF; border-radius: 17px; box-shadow: 0 8px 24px rgba(82, 107, 82, 0.20); } h2 { color: #526B52; margin-bottom: 18px; } p.subtitle { color: #6D7568; line-height: 1.5; margin-bottom: 22px; } label { display: block; font-weight: 600; color: #526B52; margin: 0 0 8px; } input { width: 100%; padding: 12px 13px; margin-bottom: 18px; border: 1px solid #C7D0BD; border-radius: 8px; background: #FBFAF5; color: #34483A; font-size: 1rem; } input:focus { outline: none; border-color: #879B79; box-shadow: 0 0 0 3px rgba(135, 155, 121, 0.18); } button { border: 0; border-radius: 8px; padding: 12px 18px; background: #879B79; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; } button:hover { background: #526B52; transform: translateY(-1px); } .secondary { background: #EEE9D9; color: #526B52; } .secondary:hover { background: #DFE5D7; } .button-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 5px; } .table-wrap { width: 100%; overflow-x: auto; } table { width: 100%; border-collapse: collapse; margin: 18px 0; background: #fff; border-radius: 8px; overflow: hidden; } th { background: #879B79; color: #fff; text-align: left; } th, td { padding: 12px 14px; border: 1px solid #E6E0CF; } tbody tr:nth-child(even), tr:nth-child(even) td { background: #F7F4E9; } tr:hover td { background: #E9EEE3; } .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; } .action-btn { width: 100%; min-height: 58px; text-align: left; background: #F7F4E9; color: #526B52; border: 1px solid #D7DECF; } .action-btn:hover { background: #879B79; color: #fff; } footer { text-align: center; color: #34483A; margin-top: 24px; font-size: 0.9rem; background: rgba(247, 244, 233, 0.90); padding: 14px; border-radius: 10px; } @media (max-width: 600px) { body { padding: 20px 10px; } main { padding: 20px 15px; } nav a { font-size: 0.86rem; padding: 9px 10px; } .actions { grid-template-columns: 1fr; } th, td { padding: 9px; white-space: nowrap; } } </style> </head> <body> <header> <h1>COLLEGE EVENT MANAGEMENT</h1> <nav aria-label="Main navigation"> <a href="index.html">Home</a> <a href="list.html">List Events</a> <a href="listOne.html">Find Event</a> <a href="insert.html">Add Event</a> <a href="update.html">Update Event</a> <a href="delete.html">Delete Event</a> </nav> </header> <main> <h2>College Event Management Dashboard</h2> <p class="subtitle"> Choose an option to manage college event records. </p> <div class="actions"> <button class="action-btn" onclick="location.href='list.html'"> 1. List Events </button> <button class="action-btn" onclick="location.href='listOne.html'"> 2. Find Required Event </button> <button class="action-btn" onclick="location.href='insert.html'"> 3. Insert Event </button> <button class="action-btn" onclick="location.href='update.html'"> 4. Update Event </button> <button class="action-btn" onclick="location.href='delete.html'"> 5. Delete Event </button> </div> </main> <footer> College Event Management System </footer> </body> </html>
