<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Insert Event</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body { min-height: 100vh; font-family: Arial, Helvetica, sans-serif; color: #34483A; padding: 28px 16px; /* College campus background image */ background-image: linear-gradient( rgba(247, 244, 233, 0.30), rgba(247, 244, 233, 0.30) ), url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1920&q=85"); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; } header { text-align: center; margin-bottom: 28px; padding: 22px 15px; background: rgba(247, 244, 233, 0.92); border-radius: 15px; } h1 { color: #526B52; font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: 20px; } nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 1100px; margin: 0 auto; } nav a { display: inline-block; padding: 11px 15px; border-radius: 9px; background: #879B79; color: #fff; text-decoration: none; font-size: 0.95rem; transition: 0.2s; } nav a:hover { background: #526B52; transform: translateY(-1px); } main { max-width: 850px; margin: 30px auto; padding: 30px; /* Transparent white form card */ background: rgba(255, 255, 255, 0.95); border: 1px solid #E6E0CF; border-radius: 17px; box-shadow: 0 8px 24px rgba(82, 107, 82, 0.20); } h2 { color: #526B52; margin-bottom: 18px; text-align: center; } p.subtitle { color: #6D7568; line-height: 1.5; margin-bottom: 22px; text-align: center; } label { display: block; font-weight: 600; color: #526B52; margin: 0 0 8px; } input { width: 100%; padding: 12px 13px; margin-bottom: 18px; border: 1px solid #C7D0BD; border-radius: 8px; background: #FBFAF5; color: #34483A; font-size: 1rem; } input:focus { outline: none; border-color: #879B79; box-shadow: 0 0 0 3px rgba(135, 155, 121, 0.18); } button { border: 0; border-radius: 8px; padding: 12px 18px; background: #879B79; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; } button:hover { background: #526B52; transform: translateY(-1px); } .secondary { background: #EEE9D9; color: #526B52; } .secondary:hover { background: #DFE5D7; } .button-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 5px; } .button-row button { flex: 1; } @media (max-width: 600px) { body { padding: 20px 10px; } main { padding: 20px 15px; } nav a { font-size: 0.86rem; padding: 9px 10px; } .button-row { flex-direction: column; } } </style> </head> <body> <header> <h1>INSERT EVENT</h1> <nav aria-label="Main navigation"> <a href="index.html">Home</a> <a href="list.html">List Events</a> <a href="listOne.html">Find Event</a> <a href="insert.html">Add Event</a> <a href="update.html">Update Event</a> <a href="delete.html">Delete Event</a> </nav> </header> <main> <h2>Enter Event Details</h2> <p class="subtitle"> Fill in the details below to add a new college event. </p> <form id="eventForm"> <label for="event_id">Event ID</label> <input type="text" id="event_id" required placeholder="Example: E101" > <label for="event_name">Event Name</label> <input type="text" id="event_name" required placeholder="Enter Event Name" > <label for="event_time">Event Time</label> <input type="text" id="event_time" required placeholder="Example: 10:00 AM" > <label for="event_day">Event Day</label> <input type="date" id="event_day" required > <label for="venue">Venue</label> <input type="text" id="venue" required placeholder="Enter Venue" > <label for="description">Description</label> <input type="text" id="description" required placeholder="Enter Event Description" > <div class="button-row"> <button type="submit"> Save Event </button> <button type="button" class="secondary" onclick="location.href='index.html'"> Home Page </button> </div> </form> </main> <script> document.getElementById("eventForm").addEventListener( "submit", function(event) { event.preventDefault(); saveEvent(); } ); function saveEvent() { const eventData = { event_id: document.getElementById("event_id").value.trim(), event_name: document.getElementById("event_name").value.trim(), event_time: document.getElementById("event_time").value.trim(), event_day: document.getElementById("event_day").value, venue: document.getElementById("venue").value.trim(), description: document.getElementById("description").value.trim() }; fetch("/events", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(eventData) }) .then(async response => { const message = await response.text(); if (!response.ok) { throw new Error( message || "Unable to save event." ); } return message; }) .then(message => { alert(message); location.href = "list.html"; }) .catch(error => { alert(error.message); }); } </script> </body> </html>
